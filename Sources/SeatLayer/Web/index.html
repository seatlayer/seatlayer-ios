<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SeatLayer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #seatlayer-root {
    position: absolute;
    inset: 0;
    touch-action: none;
  }
</style>
<!--
  The bundle is loaded from package resources instead of a CDN. Chart and
  inventory data still use the configured API. `seatlayer.js` sits next to this
  file and WKWebView is given read access to that directory only.
-->
<script src="seatlayer.js"></script>
</head>
<body>
<div id="seatlayer-root"></div>
<script>
  (function () {
    // Start the bridge as soon as the bundle is present. `startBridge` sends
    // `hello` immediately and then waits for the host's `init`, so the native
    // side is free to attach its message handler before or after this runs.
    if (!window.seatlayer || typeof window.seatlayer.startBridge !== 'function') {
      // No bundle means no bridge and therefore no `hello`; native falls back
      // to its handshake timeout, which is the correct failure.
      return;
    }
    window.__slHandle = window.seatlayer.startBridge({
      container: document.getElementById('seatlayer-root')
    });
  })();
</script>
</body>
</html>
