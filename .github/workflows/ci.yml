name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test bridge and payload contracts
        run: swift test
      - name: Build the iOS library
        run: >-
          xcodebuild
          -scheme SeatLayer
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
      - name: Build the simulator example
        run: >-
          xcodebuild
          -project Example/SeatLayerDemo.xcodeproj
          -scheme SeatLayerDemo
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Verify vendored bundle version
        run: |
          # Derived, not hard-coded. This step pinned 0.48.1 literally, so the
          # first honest bundle refresh failed CI for being correct and the
          # version had to be edited in three places instead of one. The Swift
          # constant is the single source of truth; the bundle must agree.
          version="$(sed -n 's/.*bundledWebVersion = "\(.*\)".*/\1/p' Sources/SeatLayer/SeatLayerConfiguration.swift)"
          test -n "$version" || { echo "could not read bundledWebVersion"; exit 1; }
          echo "declared bundled web version: $version"
          grep -q "$version" Sources/SeatLayer/Web/seatlayer.js \
            || { echo "vendored seatlayer.js does not carry $version"; exit 1; }
