name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      record_goldens:
        description: Re-record the chrome goldens on the CI simulator and upload them as an artifact
        type: boolean
        default: false

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check public repository hygiene
        run: bash Scripts/check-public-repository.sh
      - name: Verify generated picker design inputs
        run: node Scripts/validate-picker-design.mjs
      - name: Verify the generated picker token files are current
        run: node Scripts/generate-picker-tokens.mjs --check
      - name: Test bridge and payload contracts
        run: swift test
      - name: Build the iOS library
        run: >-
          xcodebuild
          -scheme SeatLayer
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
      - name: Build the simulator example
        run: >-
          xcodebuild
          -project Example/SeatLayerDemo.xcodeproj
          -scheme SeatLayerDemo
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      # The goldens are pinned to the runner image's iPhone 16 simulator and its
      # iOS runtime. Recording them on any other runtime moves pixels that are
      # not chrome changes, so they are recorded here, on the configuration
      # that verifies them: dispatch the workflow with `record_goldens` and
      # commit the uploaded artifact. Naming the OS in the destination made the
      # test host abort before bootstrapping on this image, so it is left to
      # the image; a runner-image change shows up as a golden diff, which is
      # the signal to re-record.
      - name: Run the chrome golden tests on a simulator
        env:
          TEST_RUNNER_SEATLAYER_RECORD_GOLDENS: ${{ inputs.record_goldens == true && '1' || '' }}
        run: >-
          xcodebuild test
          -project Example/SeatLayerDemo.xcodeproj
          -scheme SeatLayerDemo
          -destination 'platform=iOS Simulator,name=iPhone 16'
          CODE_SIGNING_ALLOWED=NO
      - name: Upload the recorded goldens
        if: ${{ always() && inputs.record_goldens == true }}
        uses: actions/upload-artifact@v4
        with:
          name: chrome-goldens
          path: Example/SeatLayerDemoTests/Goldens
      - name: Verify hosted runtime and legacy fixture metadata
        run: |
          source=Sources/SeatLayer/SeatLayerConfiguration.swift
          hosted="$(sed -n 's/.*hostedWebVersion = "\(.*\)".*/\1/p' "$source")"
          fixture="$(sed -n 's/.*legacyFixtureWebVersion = "\(.*\)".*/\1/p' "$source")"
          page_template="$(sed -n 's/^[[:space:]]*string: "\(.*\)"$/\1/p' "$source")"
          test -n "$hosted" || { echo "could not read hostedWebVersion"; exit 1; }
          test -n "$fixture" || { echo "could not read legacyFixtureWebVersion"; exit 1; }
          test "$page_template" = 'https://cdn.seatlayer.io/seatlayer-js@\(hostedWebVersion)/mobile.html' \
            || { echo "mobilePageURL does not interpolate hostedWebVersion"; exit 1; }
          test "$fixture" = "0.59.0" \
            || { echo "unexpected legacy fixture version: $fixture"; exit 1; }
          test "$(shasum -a 256 Sources/SeatLayer/Web/seatlayer.js | cut -d' ' -f1)" \
            = "89bc29fbccad5d3c30e52cf5381c974b95ac034b32c28b400248b4ebb4ee22a9" \
            || { echo "legacy seatlayer.js checksum changed"; exit 1; }
          test "$(shasum -a 256 Example/SeatLayerDemo/Resources/seatlayer.js | cut -d' ' -f1)" \
            = "89bc29fbccad5d3c30e52cf5381c974b95ac034b32c28b400248b4ebb4ee22a9" \
            || { echo "example and package fixture runtimes differ"; exit 1; }
          test "$(shasum -a 256 Sources/SeatLayer/Web/index.html | cut -d' ' -f1)" \
            = "a9a7254b0e764ba3ee602bf74bccadda9c52e1576fedc47c0afc385490a8eb4f" \
            || { echo "legacy index.html checksum changed"; exit 1; }
      - name: Verify release tag and deployed hosted runtime
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source=Sources/SeatLayer/SeatLayerConfiguration.swift
          sdk="$(sed -n 's/.*sdkVersion = "\(.*\)".*/\1/p' "$source")"
          runtime="$(sed -n 's/.*hostedWebVersion = "\(.*\)".*/\1/p' "$source")"
          test "$RELEASE_TAG" = "v$sdk"
          metadata="$(curl --fail --silent --show-error "https://cdn.seatlayer.io/seatlayer-js@$runtime/release.json")"
          test "$(printf '%s' "$metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "$runtime"
          test "$(printf '%s' "$metadata" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["promotable"]).lower())')" = true
          curl --fail --silent --show-error --output /dev/null \
            "https://cdn.seatlayer.io/seatlayer-js@$runtime/mobile.html"
