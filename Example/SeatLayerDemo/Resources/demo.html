<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SeatLayer demo fixture</title>
<style>
  html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden;
               background:#0f1116; -webkit-user-select:none; user-select:none;
               -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #seatlayer-root { position:absolute; inset:0; touch-action:none; }
</style>
<script src="seatlayer.js"></script>
</head>
<body>
<div id="seatlayer-root"></div>
<script>
/*
 * OFFLINE DEMO FIXTURE.
 *
 * There is no public event key guaranteed to exist, and the point of this demo
 * is to prove the BRIDGE, not the booking API. So we run the REAL bridge
 * runtime out of the shipped bundle (`startBridge` — the same handshake,
 * envelope, correlation and event-sequencing code a production page uses) and
 * hand it a stub chart via the documented `createChart` option.
 *
 * The stub is not a fake renderer: its `render()` calls the bundle's own
 * `renderChartDocument`, so the seats on screen are painted by the real buyer
 * renderer from a real ChartDoc. Only the network-backed hold/booking calls are
 * simulated in memory.
 */
(function () {
  var CATEGORIES = [
    { key: 'vip',      label: 'VIP',      color: '#f0b429', price: 180 },
    { key: 'premium',  label: 'Premium',  color: '#4c9aff', price: 120 },
    { key: 'standard', label: 'Standard', color: '#57d9a3', price: 65  }
  ];

  /* A modest theatre: 12 curved rows, widening toward the back. */
  function buildChart() {
    var objects = [];
    var rows = 12;
    for (var i = 0; i < rows; i++) {
      var seatCount = 14 + Math.floor(i / 2) * 2;
      var category = i < 2 ? 'vip' : (i < 6 ? 'premium' : 'standard');
      var spacing = 30;
      objects.push({
        type: 'row',
        id: 'row-' + i,
        label: String.fromCharCode(65 + i),
        origin: { x: 600 - (seatCount - 1) * spacing / 2, y: 220 + i * 46 },
        rotation: 0,
        curve: 14,
        seatCount: seatCount,
        seatSpacing: spacing,
        categoryKey: category
      });
    }
    return {
      version: 1,
      name: 'SeatLayer iOS demo',
      venueType: 'SIMPLE',
      focalPoint: { x: 600, y: 60 },
      categories: CATEGORIES,
      objects: objects
    };
  }

  var CHART = buildChart();

  /* Flatten the chart the same way the renderer does, for the stub's inventory. */
  function seatInventory() {
    var seats = [];
    CHART.objects.forEach(function (row) {
      for (var n = 1; n <= row.seatCount; n++) {
        seats.push({
          id: row.id + ':' + (n - 1),
          label: row.label + '-' + n,
          categoryKey: row.categoryKey,
          price: CATEGORIES.filter(function (c) { return c.key === row.categoryKey; })[0].price
        });
      }
    });
    return seats;
  }

  var INVENTORY = seatInventory();

  /* ---- the stub chart the bridge drives -------------------------------- */
  function makeStubChart(options) {
    var selection = [];
    var currentHold = null;
    var holdSeq = 0;
    var preview = null;

    function emitSelection() {
      if (options.onSelectionChange) options.onSelectionChange(selection.slice());
    }

    function newHold(seats) {
      holdSeq += 1;
      currentHold = {
        holdId: 'demo_hold_' + holdSeq,
        expiresAt: Date.now() + 15 * 60 * 1000,
        seats: seats.slice(),
        items: seats.map(function (s) {
          return {
            label: s.label, objectId: s.id, objectType: 'seat',
            categoryKey: s.categoryKey, tierId: null,
            unitPrice: s.price, currency: 'USD', quantity: 1
          };
        })
      };
      if (options.onHold) options.onHold(currentHold);
      return currentHold;
    }

    return {
      render: function () {
        preview = window.seatlayer.renderChartDocument({
          container: options.container,
          chart: CHART,
          currency: options.currency || 'USD',
          colorblindSafe: !!options.colorblindSafe
        });
        // Seed a selection so the native side has something to display without
        // requiring a tap, and so `selection.changed` is exercised for real.
        selection = [INVENTORY[3], INVENTORY[4]];
        setTimeout(emitSelection, 0);
        return Promise.resolve();
      },
      getMode: function () { return 'test'; },
      hold: function () { return Promise.resolve(newHold(selection)); },
      resumeHold: function (holdId) {
        return Promise.resolve(currentHold && currentHold.holdId === holdId ? currentHold : null);
      },
      extendHold: function (ttlMs) {
        if (!currentHold) return Promise.resolve(null);
        currentHold.expiresAt = Date.now() + (ttlMs || 15 * 60 * 1000);
        if (options.onHold) options.onHold(currentHold);
        return Promise.resolve(currentHold);
      },
      release: function () {
        currentHold = null;
        selection = [];
        emitSelection();
        return Promise.resolve();
      },
      releaseLabels: function (labels) {
        selection = selection.filter(function (s) { return labels.indexOf(s.label) === -1; });
        emitSelection();
        return Promise.resolve(true);
      },
      bestAvailable: function (qty, categoryKey) {
        var pool = INVENTORY.filter(function (s) {
          return !categoryKey || s.categoryKey === categoryKey;
        });
        if (pool.length < qty) {
          // Exercise the error path with a REAL API-shaped code.
          var err = new Error('not enough seats together');
          err.code = 'not_enough_together';
          err.status = 409;
          return Promise.reject(err);
        }
        var picked = pool.slice(0, qty);
        var hold = newHold(picked);
        selection = picked.slice();
        emitSelection();
        return Promise.resolve({
          holdId: hold.holdId, expiresAt: hold.expiresAt,
          labels: picked.map(function (s) { return s.label; }),
          seats: picked, items: hold.items
        });
      },
      holdGA: function () { return Promise.resolve(newHold([])); },
      setSeatTier: function () {},
      getSelection: function () { return selection.slice(); },
      getCurrentHold: function () { return currentHold; },
      getGAAreas: function () { return []; },
      getFloors: function () { return [{ id: 'main', name: 'Main floor' }]; },
      setFloor: function () {},
      setColorblindSafe: function () {},
      zoomIn: function () {},
      zoomOut: function () {},
      zoomToFit: function () { if (preview) preview.forceDraw(); },
      destroy: function () { if (preview) { preview.destroy(); preview = null; } }
    };
  }

  if (!window.seatlayer || typeof window.seatlayer.startBridge !== 'function') return;

  window.__slHandle = window.seatlayer.startBridge({
    container: document.getElementById('seatlayer-root'),
    createChart: makeStubChart
  });
})();
</script>
</body>
</html>
